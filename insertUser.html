<html>
<head>
    <title>Register User</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form action="processUser.jsp" method="post">
            <label>Username</label>
            <input type="text" name="username" maxlength="15" required>
            
            <label>Password</label>
            <input type="password" name="password" maxlength="10" required>
            
            <label>First Name</label>
            <input type="text" name="firstname">
            
            <label>Last Name</label>
            <input type="text" name="lastname">
            
            <input type="submit" value="Register">
        </form>
        <p style="text-align:center;"><a href="login.jsp" style="font-size: 14px;">Already have an account? Login</a></p>
    </div>
</body>
</html>
