<html>
    <head>
        <title>Currency Conversion System</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Use JSP Declaration Tag, JSP Scriptlet and JSP Expression in Application</h1>
            <div class="card">
                <h2 class="form-title">Currency Conversion</h2>
                <form action="processCurrency.jsp" method="POST">
                    
                    <div class="form-group">
                        <label>Amount (in RM):</label>
                        <input type="number" step="0.01" name="amount" placeholder="[in RM]" required>
                    </div>

                    <div class="form-group">
                        <label>Convert to:</label>
                        <select name="currencyType">
                            <option value="1">USD</option>
                            <option value="2">EURO</option>
                            <option value="3">JPY</option>
                            <option value="4">SGD</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Cancel">
                    </div>
                    
                </form>
            </div>
        </div>
    </body>
</html>
